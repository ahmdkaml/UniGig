<header class="border-b border-slate-200 bg-white">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
    <a routerLink="/" class="text-lg font-bold tracking-tight text-slate-900">
      UniGig
    </a>

    <div class="flex items-center gap-4 text-sm font-medium">
      @if (authService.isAuthenticated()) {
        <a routerLink="/marketplace" class="text-slate-600 hover:text-slate-900">Marketplace</a>
        <a routerLink="/profile" class="text-slate-600 hover:text-slate-900">
          My Profile
        </a>
        <button
          type="button"
          (click)="onLogout()"
          class="rounded-md bg-slate-900 px-3 py-1.5 text-white hover:bg-slate-800"
        >
          Logout
        </button>
      } @else {
        <a routerLink="/auth/login" class="text-slate-600 hover:text-slate-900">Login</a>
        <a
          routerLink="/auth/register"
          class="rounded-md bg-slate-900 px-3 py-1.5 text-white hover:bg-slate-800"
        >
          Register
        </a>
      }
    </div>
  </nav>
</header>
