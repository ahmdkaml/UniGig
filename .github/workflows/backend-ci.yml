name: Backend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'unigig-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'unigig-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Maven Build & Test (Java 25)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unigig
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./unigig-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: unigig-backend/pom.xml

      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw

      - name: Compile and run backend tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/unigig
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          # Add any other env vars from your .env or application.yml below (e.g., JWT_SECRET)
        run: ./mvnw test --batch-mode --no-transfer-progress
