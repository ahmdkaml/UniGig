# ==============================================================================
# Slim / Free-Tier Hosting Profile (Embedded H2 in PostgreSQL Mode + Low RAM)
# Activate with: --spring.profiles.active=slim (or SPRING_PROFILES_ACTIVE=slim)
# ==============================================================================

server.port=${PORT:8080}
server.compression.enabled=true
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.threads.min-spare=2

# Embedded file-backed H2 database running in PostgreSQL compatibility mode
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/unigig;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Minimal connection pool footprint for free hosting
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Flyway & Hibernate validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Lazy initialization to reduce startup memory and boot time on restricted vCPUs
spring.main.lazy-initialization=true

# JWT & CORS Settings (inherits or overrides via environment variables)
app.jwt.secret=${JWT_SECRET:replace-with-a-256-bit-base64-secret-key-for-local-dev}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
